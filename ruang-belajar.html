 (k||[]).forEach(function(c){e.appendChild(typeof c==="string"?document.createTextNode(c):c)});return e}

function field(id,lbl,val,ph,set){var i=h("input",{id:id,placeholder:ph,value:val,autocomplete:"off"});i.oninput=function(){set(i.value)};return h("div",{class:"field"},[h("label",{for:id},[lbl]),i])}

  ["Semua"].concat(l).forEach(function(k){var on=(k==="Semua"&&!S.fkls)||k===S.fkls;w.appendChild(h("button",{class:"chip"+(on?" on":""),"aria-pressed":on?"true":"false",onclick:function(){S.fkls=k==="Semua"?"":k;render()}},[k==="Semua"?"Semua kelas":k]))});view.appendChild(w)}

var TKA="Kamu penyusun soal Tes Kemampuan Akademik (TKA) Kemendikdasmen. Ikuti ketentuan TKA:\n- Utamakan soal berbasis stimulus (teks pendek, data atau tabel dalam teks, kasus, atau situasi nyata) yang ditulis pada properti 'stimulus'; boleh kosong untuk soal pengetahuan langsung.\n- Tiga bentuk soal: 'pg' = pilihan ganda sederhana (4 pilihan, satu jawaban benar, 'benar' berupa angka indeks 0 sampai 3); 'mcma' = pilihan ganda kompleks (5 pilihan, dua atau lebih jawaban benar, 'benar' berupa array indeks, kalimat soal memuat petunjuk Pilih semua jawaban yang benar); 'kategori' = pilihan ganda kompleks kategori (3 sampai 4 pernyataan pada 'pilihan', 'soal' berisi instruksi menentukan Benar atau Salah tiap pernyataan, 'benar' berupa array boolean sesuai urutan pernyataan, true berarti Benar, campurkan true dan false). Komposisi kira-kira 60% pg, 20% mcma, 20% kategori.\n- Level kognitif 'level': 'pemahaman', 'penerapan', atau 'penalaran'; utamakan penerapan dan penalaran.\n- Pengecoh masuk akal dan panjang pilihan seimbang; jangan memakai pilihan semua benar atau semua salah.\n- Isi akurat, sesuai TP dan materi, bahasa Indonesia baku sesuai jenjang.";

function L(i){return "ABCDEF".charAt(i)}

  if(b==="mcma")return p>=4&&p<=6&&Array.isArray(q.benar)&&q.benar.length>=1&&q.benar.every(function(x){return Number.isInteger(x)&&x>=0&&x<p});

  else if(y.st==="ok"){t="\u2601 Tersinkron ke Google Drive pukul "+y.t.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});cls="ok-t"}
  else if(y.st==="kosong")t="Google Drive: belum ada data untuk disinkronkan.";
  else{t="Belum tersinkron ke Google Drive: "+y.msg;cls="err"}
  return h("p",{class:cls,style:"margin:0 0 12px",role:"status"},[t])}
